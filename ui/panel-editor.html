<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>JianyingCraft 编辑器</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; grid-template-rows: auto 1fr auto; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #14161a; color: #e6e8ec; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #1c1f26; border-bottom: 1px solid #2b303a; }
  header b { font-weight: 600; }
  .badge { padding: 1px 8px; border-radius: 10px; font-size: 11px; background: #2b303a; }
  .badge.ok { background: #1d4d33; color: #7ee2a8; }
  .badge.bad { background: #5a2530; color: #ff9aa8; }
  main { position: relative; min-height: 0; }
  /* eframe 的 canvas 会自己铺满父容器 */
  #editor-canvas { display: block; width: 100%; height: 100%; background: #0d0f12; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #6d7686; padding: 24px; }
  #boot code { color: #9aa3b2; }
  footer { padding: 6px 12px; font-size: 11px; color: #6d7686; border-top: 1px solid #2b303a; }
</style>
</head>
<body>
<header>
  <b>JianyingCraft</b>
  <span id="engine" class="badge">引擎未加载</span>
  <span id="bridge" class="badge">面板桥未连接</span>
</header>
<main>
  <canvas id="editor-canvas" width="1280" height="720"></canvas>
  <div id="boot">
    <p>正在加载引擎…<br><code id="boot-detail"></code></p>
  </div>
</main>
<footer>命令由本机引擎执行；没有引擎时面板桥只回 <code>command_failed</code>，不会静默成功。</footer>
</body>
</html>
